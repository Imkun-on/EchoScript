<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>EchoScript</title>
  <!-- WebView2 non mostra nessuna scheda, quindi qui non si vede: serve a chi
       apre questo file in un browser per lavorarci sopra. -->
  <link rel="icon" href="../assets/EchoScript.png">
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>

  <!-- Le icone stanno qui una volta sola e si richiamano con <use>. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>

        <rect x="7" y="7" width="10" height="10" rx="2"/>
        <rect x="3.5" y="3.5" width="17" height="17" rx="3.5" opacity=".45"/>
        <path d="M10 1.5v2M14 1.5v2M10 20.5v2M14 20.5v2M1.5 10h2M1.5 14h2M20.5 10h2M20.5 14h2"/>

        <path d="M4.5 6.5v11c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-11"/>
        <path d="M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/>
      </g>
      <g id="i-cerca" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>
      </g>
      <g id="i-video" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="4.5" width="19" height="15" rx="3"/>
        <path d="M10 9.2l5 2.8-5 2.8z"/>
      </g>
      <g id="i-file-audio" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M13.5 2.5H7a2 2 0 00-2 2v15a2 2 0 002 2h10a2 2 0 002-2V8z"/>
        <path d="M13.5 2.5V8H19"/><path d="M9 16v-3.5M12 17.5v-6.5M15 15.5v-2.5"/>
      </g>
      <g id="i-avvia" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 4.5l12 7.5-12 7.5z"/>
      </g>
      <g id="i-vuoto" fill="none" stroke="currentColor" stroke-width="1.3"
         stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18M8.5 14.5h7"/>
      </g>
      <g id="i-cartella" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7a2 2 0 012-2h4l2 2.5h8a2 2 0 012 2V17a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
      </g>
      <g id="i-chiave" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <circle cx="7.5" cy="15.5" r="4"/>
        <path d="M10.4 12.6L20 3M17 6l2.5 2.5M14.5 8.5l2.5 2.5"/>
      </g>
      <g id="i-nuvola" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 18.5h10.5a4 4 0 000-8 6 6 0 00-11.6 1.6A3.6 3.6 0 007 18.5z"/>
      </g>
      <g id="i-casa" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="5" width="19" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>
      </g>
      <g id="i-rifai" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 12a8 8 0 11-2.6-5.9"/><path d="M20 3v5h-5"/>
      </g>
      <g id="i-riprendi" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M10 8.5l5.5 3.5L10 15.5z"/>
      </g>
      <g id="i-traduci" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 5.5h8M7 3.5v2M9 5.5c0 3.6-2.6 6.6-6 7.5M5 9c1 2.2 3 3.9 5.5 4.5"/>
        <path d="M12 20.5l4-9 4 9M13.4 17.5h5.2"/>
      </g>
      <g id="i-riassumi" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5.5h11M4 10h11M4 14.5h7M4 19h5"/><circle cx="17.5" cy="17.5" r="3.2"/>
      </g>
      <g id="i-spunta" fill="none" stroke="currentColor" stroke-width="1.9"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 12.5l5 5 10-11"/>
      </g>
      <g id="i-clessidra" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.5 3h11M6.5 21h11M8 3v4l4 5 4-5V3M8 21v-4l4-5 4 5v4"/>
      </g>
      <g id="i-avviso" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3.5L21.5 20h-19z"/><path d="M12 9.5v5M12 17.2v.3"/>
      </g>
      <g id="i-errore" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.2v.3"/>
      </g>
      <g id="i-freccia" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 5l7 7-7 7"/>
      </g>
      <g id="i-leggi" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 5.5c2.8-1.2 5.8-1.2 9 .8v13c-3.2-2-6.2-2-9-.8z"/>
        <path d="M21 5.5c-2.8-1.2-5.8-1.2-9 .8v13c3.2-2 6.2-2 9-.8z"/>
      </g>
      <g id="i-togli" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 6l12 12M18 6L6 18"/>
      </g>
      <g id="i-collega" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 14a4.5 4.5 0 006.4 0l3-3a4.5 4.5 0 00-6.4-6.4l-1 1"/>
        <path d="M14 10a4.5 4.5 0 00-6.4 0l-3 3a4.5 4.5 0 006.4 6.4l1-1"/>
      </g>
      <g id="i-opzioni" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>
      </g>
    </defs>
  </svg>

  <!-- L'impianto e' quello di un programma da lavoro, lo stesso di MediaFlow:
       la testata in alto, a sinistra la colonna stretta delle stanze, in
       mezzo lo spazio di lavoro, a destra le opzioni di quello che si sta
       facendo, in fondo la barra di stato. -->
  <div class="guscio">

    <header class="testata">
      <!-- Il marchio: il topo da biblioteca scontornato. E' lo stesso segno
           dell'icona sul desktop, cosi' chi ha appena fatto doppio clic lo
           ritrova dentro la finestra. marchio.png e le icone dell'eseguibile
           escono tutti da assets/marchio.py. -->
      <div class="marca">
        <img src="marchio.png" alt="" draggable="false">
        <span>EchoScript<span class="marca-punto">.</span></span>
      </div>
      <div class="briciole">
        <span data-t="testata.spazio"></span><span class="briciole-taglio">/</span>
        <strong id="briciola"></strong>
      </div>
      <!-- Le stanze lavorano anche quando non le si guarda: questa dice dove
           sta girando qualcosa, o dove c'e' un riepilogo da leggere, e
           cliccandola ci si va. -->
      <button class="pillola-lavori" id="pillola-lavori" hidden>
        <span class="punto-vivo"></span><span id="pillola-testo"></span>
      </button>
    </header>

    <div class="impianto">

      <!-- Due postazioni, non due impostazioni: in ciascuna c'e' tutto il
           lavoro (link o file, opzioni, avvio, avanzamento) e quello che
           cambia sono i modelli con cui viene fatto. Scegliere la stanza E'
           scegliere il motore. Il nome compare passandoci sopra; il puntino
           sull'icona dice se li' dentro sta succedendo qualcosa. -->
      <nav class="barra">
        <div class="menu">
          <button class="voce attiva" data-va="locale">
            <svg class="icona" viewBox="0 0 24 24"><use href="#i-casa"/></svg>
            <span class="voce-nome" data-t="menu.locale"></span>
            <span class="targhetta-menu spenta" id="targhetta-locale"></span>
          </button>
          <button class="voce" data-va="cloud">
            <svg class="icona" viewBox="0 0 24 24"><use href="#i-nuvola"/></svg>
            <span class="voce-nome" data-t="menu.cloud"></span>
            <span class="targhetta-menu spenta" id="targhetta-cloud"></span>
          </button>
        </div>
      </nav>

      <main class="corpo">

        <!-- ══ LA POSTAZIONE DI LAVORO, COME MODELLO ════════════════════ -->
        <!-- Questo blocco non compare a schermo: e' lo stampo. All'avvio ne
             vengono fatte DUE copie vere, una dentro «Locale» e una dentro
             «Cloud», e da quel momento vivono separate: si puo' avere un link
             incollato qui e un altro li', e un lavoro in corso in tutte e due
             nello stesso momento.

             Le copie non sono identiche: ognuna tiene solo i modelli del
             proprio motore, e la chiave sta soltanto in «Cloud», perche' e'
             l'unica stanza in cui si paga qualcosa. Chi le pota, e chi scrive
             nell'intestazione il nome della stanza, e' creaPosti() in posti.js.

             Gli identificatori qui dentro sono scritti nudi ma non restano
             tali: copiando, ognuno prende davanti il nome della stanza. Cosi'
             «url» diventa «locale-url» e «cloud-url», che sono due caselle
             diverse e non possono essere scambiate per sbaglio. -->
        <template id="modello-postazione">
        <div class="postazione">

          <div class="lavoro">
            <header class="intestazione">
              <div class="simbolo"><svg class="icona" viewBox="0 0 24 24"><use id="simbolo-uso"/></svg></div>
              <div>
                <div class="occhiello" id="occhiello"></div>
                <h1 id="titolo"></h1>
              </div>
            </header>
            <p class="intro" id="intro"></p>

            <!-- Da dove entra il materiale. Resta attivo anche mentre la
                 postazione lavora: e' da qui che si incolla il prossimo link,
                 che va in coda.

                 Il link non ha un bottone per leggerlo: si legge da solo appena
                 incollato (o dopo un attimo di pausa mentre lo si scrive), e
                 l'anteprima si apre in una finestra. La riga sotto la casella
                 dice che cosa sta succedendo. -->
            <section class="importa resta-attivo">
              <div class="importa-capo">
                <svg class="icona" viewBox="0 0 24 24"><use href="#i-collega"/></svg>
                <h2 data-t="src.label"></h2>
              </div>
              <div class="modulo-link">
                <select id="sorgente" class="campo">
                  <option value="youtube" data-t="src.youtube"></option>
                  <option value="local" data-t="src.local"></option>
                </select>
                <!-- I due ingressi occupano lo stesso posto: si vede solo
                     quello della sorgente scelta. -->
                <div class="campo-icona" id="ingresso-youtube">
                  <svg class="icona-campo" viewBox="0 0 24 24"><use href="#i-video"/></svg>
                  <input id="url" class="campo con-icona" type="text" spellcheck="false"
                         placeholder="https://www.youtube.com/watch?v=…">
                </div>
                <!-- Il file non si scrive, si sceglie: la casella intera e' il
                     bottone che apre la finestra del sistema. -->
                <div class="campo-icona" id="ingresso-file" hidden>
                  <svg class="icona-campo" viewBox="0 0 24 24"><use href="#i-file-audio"/></svg>
                  <input id="file" class="campo con-icona scelto" type="text" readonly>
                </div>
              </div>
              <div class="importa-nota" id="lettura" data-t="src.load.hint"></div>
            </section>

            <!-- L'avanzamento compare solo mentre si lavora. Dentro c'e' tutto
                 quello che serve a capire a che punto siamo: chi sta
                 lavorando, in che fase, quanto manca, e l'elenco dei passaggi
                 con quelli fatti gia' spuntati. -->
            <section class="pannello avanzamento" id="avanzamento">
              <div class="titolo-pannello">
                <span class="spia working"></span>
                <span data-t="prog.title"></span>
                <span class="targhetta-motore" id="badge-motore"></span>
                <span class="targhetta elastica" id="badge-batch" hidden></span>
                <div class="spazio"></div>
                <span class="targhetta" id="badge-fase"></span>
                <span class="avanz-pct" id="avanz-pct"></span>
                <span class="avanz-eta" id="avanz-eta"></span>
                <!-- Resta cliccabile mentre tutto il resto della postazione e'
                     spento: e' l'unico gesto che ha senso durante un lavoro. -->
                <button id="annulla" class="bottone contorno piccolo resta-attivo">
                  <svg class="icona" viewBox="0 0 24 24"><use href="#i-togli"/></svg>
                  <span data-t="prog.cancel"></span>
                </button>
              </div>
              <div class="avanz-nota" id="badge-nota" hidden></div>
              <div class="binario"><div class="cursa" id="barra"></div></div>
              <div class="avanz-riga">
                <span class="avanz-titolo" id="avanz-fase"></span>
                <span class="avanz-dettaglio" id="avanz-dettaglio"></span>
              </div>
              <div class="passi" id="passi"></div>
              <div class="racconto">
                <div id="racconto-testo"></div>
                <div class="racconto-piano" id="racconto-piano"></div>
              </div>
            </section>

            <!-- Quello che si e' scelto di trascrivere, e sotto i video che
                 aspettano il loro turno. La spia e la parola di stato dicono
                 se la postazione sta lavorando. -->
            <section class="pannello sorgente">
              <div class="titolo-pannello">
                <span class="spia" id="spia"></span>
                <span data-t="src.panel"></span>
                <span class="stato" id="stato"></span>
                <div class="spazio"></div>
                <span class="targhetta" id="stima"></span>
              </div>
              <div class="sorgente-corpo">
                <div id="sorgente-scheda" class="elenco"></div>
                <!-- Ciascuno con il suo × per toglierlo prima che parta.
                     Vuota, non si vede. -->
                <div class="coda-blocco" id="coda-blocco" hidden>
                  <label class="etichetta" data-t="coda.title"></label>
                  <div class="elenco-video" id="coda-lista"></div>
                </div>
              </div>
            </section>
          </div>

          <!-- Le opzioni di questa stanza: con che cosa si trascrive, e come
               deve venire il riassunto. Prima stavano in tre riquadri che
               aprivano tre finestre; adesso sono sempre a vista, e il bottone
               che fa partire tutto sta in fondo, dopo l'ultima scelta. -->
          <aside class="ispettore">
            <div class="ispettore-testa">
              <svg class="icona" viewBox="0 0 24 24"><use href="#i-opzioni"/></svg>
              <h2 data-t="opz.titolo"></h2>
            </div>
            <div class="ispettore-corpo">

              <section class="blocco" id="modulo-modelli-locale">
                <h3 class="blocco-titolo" data-t="opz.modelli"></h3>
                <div class="gruppo">
                  <label data-t="eng.model.whisper"></label>
                  <select id="m-whisper" class="campo"></select>
                </div>
                <div class="gruppo">
                  <label data-t="eng.model.ollama"></label>
                  <select id="m-ollama" class="campo"></select>
                </div>
                <div class="nota-riga" data-t="eng.local.hint"></div>
              </section>

              <section class="blocco" id="modulo-modelli-cloud">
                <h3 class="blocco-titolo" data-t="opz.modelli"></h3>
                <div class="gruppo">
                  <label data-t="eng.model.groq"></label>
                  <select id="m-groq" class="campo"></select>
                </div>
                <div class="gruppo">
                  <label data-t="eng.model.groqtesto"></label>
                  <select id="m-groq-testo" class="campo"></select>
                </div>
                <div class="nota-riga" data-t="eng.groq.hint"></div>
              </section>

              <!-- Del file caricato si mostra il nome e nient'altro: la chiave
                   e' un segreto, e vederla scritta a schermo non serve a
                   nessuno. -->
              <section class="blocco" id="carta-chiave">
                <h3 class="blocco-titolo" data-t="opz.chiave"></h3>
                <div class="stato-chiave" id="stato-chiave"></div>
                <button id="carica-chiave" class="bottone contorno">
                  <svg class="icona" viewBox="0 0 24 24"><use href="#i-chiave"/></svg>
                  <span data-t="eng.key.load"></span>
                </button>
                <button id="ottieni-chiave" class="bottone nudo" data-t="eng.key.get"></button>
              </section>

              <!-- Il riassunto non ha un interruttore: si fa sempre, ed e'
                   l'unica cosa che finisce fra i risultati. Queste sono le sue
                   aggiunte e la sua misura. -->
              <section class="blocco">
                <h3 class="blocco-titolo" data-t="opts.title"></h3>
                <div class="interruttori">
                  <label class="interruttore rovescio">
                    <input type="checkbox" id="opt-translate"><span class="cursore"></span>
                    <span class="interruttore-testo">
                      <span class="interruttore-nome" data-t="opt.translate"></span>
                      <span class="interruttore-nota" data-t="opt.translate.desc"></span>
                    </span>
                  </label>
                  <label class="interruttore rovescio">
                    <input type="checkbox" id="opt-charts"><span class="cursore"></span>
                    <span class="interruttore-testo">
                      <span class="interruttore-nome" data-t="opt.charts"></span>
                      <span class="interruttore-nota" data-t="opt.charts.desc"></span>
                    </span>
                  </label>
                  <label class="interruttore rovescio">
                    <input type="checkbox" id="opt-comments"><span class="cursore"></span>
                    <span class="interruttore-testo">
                      <span class="interruttore-nome" data-t="opt.comments"></span>
                      <span class="interruttore-nota" data-t="opt.comments.desc"></span>
                    </span>
                  </label>
                </div>
                <div class="gruppo" id="riga-dettaglio">
                  <label data-t="opt.detail"></label>
                  <select id="opt-detail" class="campo">
                    <option value="esteso" data-t="opt.detail.esteso"></option>
                    <option value="normale" data-t="opt.detail.normale"></option>
                    <option value="breve" data-t="opt.detail.breve"></option>
                    <option value="punti" data-t="opt.detail.punti"></option>
                  </select>
                </div>
              </section>
            </div>

            <div class="ispettore-piede">
              <button id="avvia" class="bottone pieno">
                <svg class="icona" viewBox="0 0 24 24"><use href="#i-avvia" id="icona-avvia"/></svg>
                <span id="testo-avvia" data-t="src.start"></span>
              </button>
              <p class="piede-nota" data-t="src.start.nota"></p>
            </div>
          </aside>
        </div>
        </template>

        <!-- ══ LOCALE ═══════════════════════════════════════════════════ -->
        <!-- Qui dentro non compare niente che abbia bisogno della rete: e' la
             promessa della sezione. Chi trascrive da qui trascrive sul proprio
             computer: non c'e' un interruttore da ricordarsi, e' la stanza in
             cui si sta. -->
        <div class="sezione attiva" data-sez="locale" data-icona="i-casa"></div>

        <!-- ══ CLOUD ════════════════════════════════════════════════════ -->
        <!-- E qui dentro, per lo stesso motivo, solo cose che vivono sui
             server Groq: i due modelli e la chiave che li paga. -->
        <div class="sezione" data-sez="cloud" data-icona="i-nuvola"></div>

      </main>
    </div>

    <footer class="barra-stato">
      <span class="punto-stato" id="stato-punto"></span>
      <span id="stato-testo"></span>
      <!-- Quanto manca alla fase in corso, quando a lavorare e' una stanza
           sola: con due insieme un numero unico non direbbe niente. -->
      <div class="stato-avanzo" id="stato-avanzo" hidden>
        <div><span id="stato-cursa"></span></div>
        <span id="stato-percento"></span>
      </div>
      <!-- La spia di Tor: dice se YouTube vede l'IP di casa o quello di un
           nodo Tor. La tiene aggiornata sorvegliaTor(), in app.js. -->
      <div class="spia-tor" id="spia-tor" data-fase="avvio">
        <span class="spia-tor-punto"></span><span class="spia-tor-testo"></span>
      </div>
      <span class="barra-stato-coda" data-t="stato.privato"></span>
    </footer>
  </div>

  <div class="avvisi" id="avvisi"></div>

  <div class="velo-trascina" id="velo-trascina">
    <div class="riquadro-trascina">
      <svg class="icona" viewBox="0 0 24 24"><use href="#i-collega"/></svg>
      <span data-t="trascina"></span>
    </div>
  </div>

  <!-- La finestra modale e' una sola e viene riempita di volta in volta:
       conferma di un video, elenco di scelte, risultato, avviso. Averne una
       per caso significherebbe cinque strutture da tenere allineate. -->
  <div class="velo-finestra" id="velo-finestra">
